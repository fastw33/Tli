# Paste this entire server block into Coolify > Custom Nginx Configuration.
# Build pack: Nixpacks. Static site: enabled. SPA: disabled. Publish: /out.
# Save and redeploy; restarting the previous image does not change its config.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/mime.types;
    charset utf-8;

    if ($host = www.tlimiami.com) {
        return 301 https://tlimiami.com$request_uri;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml text/xml image/svg+xml;

    error_page 404 /404.html;

    location = /clients { return 301 https://tlimiami.com/regions$is_args$args; }
    location = /es/clients { return 301 https://tlimiami.com/es/regions$is_args$args; }

    location = /sitemap.xml {
        types { }
        default_type application/xml;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /robots.txt {
        types { }
        default_type text/plain;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /404.html {
        internal;
    }

    location ~ ^/(?:es/)?llms(?:-full)?\.txt$ {
        types { }
        default_type text/plain;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ^~ /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~ ^(.+)/$ {
        return 301 https://tlimiami.com$1$is_args$args;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/ =404;
    }
}
